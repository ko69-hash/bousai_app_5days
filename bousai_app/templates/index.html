{% extends "base.html" %}

{% block content %}
<div class="page-card">
  <div class="panel-inner">
    <div class="panel-title">
      <span class="title-icon">📍</span>
      <h2>避難所マップ</h2>
    </div>
    <div id="shelterMap" class="map-box"></div>
  </div>
</div>

<div class="page-card">
  <div class="panel-inner">
    <div class="weather-header-row">
      <div class="panel-title">
        <span class="title-icon">🌤️</span>
        <h2>青森市 気象警報・注意報</h2>
      </div>
      <div class="weather-meta">
        <span>⟳</span>
        <span>10分おきに自動更新</span>
      </div>
    </div>

    <div id="weatherContent" class="weather-content">
      <p>読み込み中...</p>
    </div>
  </div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const map = L.map('shelterMap').setView([40.8244, 140.7400], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        referrerPolicy: 'strict-origin-when-cross-origin'
    }).addTo(map);

    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(response => response.json())
            .then(data => {
                console.log('気象情報を更新しました:', data);
                updateWeatherContent(data);
            })
            .catch(error => {
                console.error('気象情報の更新に失敗しました:', error);
            });
    }

    function updateWeatherContent(data) {
        const weatherContent = document.getElementById('weatherContent');

      function getWarningLevel(code) {
        const levels = {
          '32': 5, '33': 5, '35': 5, '36': 5, '37': 5, '38': 5, '39': 5,
          '43': 4, '48': 4, '49': 4,
          '03': 3, '04': 3, '05': 3, '06': 3, '07': 3, '08': 3, '09': 3,
          '10': 2, '12': 2, '13': 2, '14': 2, '15': 2, '16': 2,
          '17': 2, '18': 2, '19': 2, '20': 2, '21': 2, '22': 2,
          '23': 2, '24': 2, '25': 2, '26': 2, '27': 2, '29': 2
        };
        return levels[code] || 1;
      }

        if (data.error) {
            weatherContent.innerHTML = '<p>気象情報の取得に失敗しました</p>';
            return;
        }

        let warningsHtml = '';
        if (data.warnings && data.warnings.length > 0) {
          warningsHtml = '<ul class="warning-list">';
            data.warnings.forEach(warning => {
            const level = getWarningLevel(warning.code);
            warningsHtml += `<li class="warning-item level-${level}"><span class="level-label">警戒レベル ${level}</span> <strong>${warning.name}</strong>（${warning.status}）</li>`;
            });
            warningsHtml += '</ul>';
        } else {
            warningsHtml = '<div class="weather-status"><span class="check">✓</span><span>現在、警報・注意報は発表されていません</span></div>';
        }

        weatherContent.innerHTML = `
            <div class="weather-city">
              <span class="title-icon">📍</span>
              <span>${data.area_name || '青森市'}</span>
            </div>
            ${warningsHtml}
            <div class="weather-detail"><span class="dot">◉</span><span>データ取得: ${data.last_fetch_time || '更新中...'}</span></div>
            <div class="weather-detail"><span class="dot">◌</span><span>気象庁発表: ${data.report_time || '不明'}</span></div>
        `;
    }

    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
