{% extends "base.html" %}

{% block content %}
<section id="alertBanner" class="alert-banner" aria-live="polite" hidden></section>

<section class="dashboard-grid" aria-label="現在の防災情報">
  <article class="page-card status-card">
    <div class="panel-inner">
      <div class="section-eyebrow">CURRENT STATUS</div>
      <div class="panel-title">
        <span class="title-icon title-icon--weather"><svg class="icon" aria-hidden="true"><use href="#icon-cloud"></use></svg></span>
        <div><h2>青森市の状況</h2><p class="panel-subtitle">いま確認できる気象情報</p></div>
      </div>
      <div id="weatherContent" class="weather-content"><p>読み込み中...</p></div>
      <div class="weather-meta"><svg class="icon" aria-hidden="true"><use href="#icon-clock"></use></svg><span>10分おきに自動更新</span></div>
    </div>
  </article>

  <article class="page-card map-card">
    <div class="panel-inner">
      <div class="map-heading">
        <div class="panel-title">
          <span class="title-icon title-icon--map"><svg class="icon" aria-hidden="true"><use href="#icon-map"></use></svg></span>
          <div><h2>避難所マップ</h2><p class="panel-subtitle">現在地周辺の避難所を確認</p></div>
        </div>
        <a class="text-link" href="/shelter_search">一覧を見る <span aria-hidden="true">→</span></a>
      </div>
      <div id="shelterMap" class="map-box"></div>
    </div>
  </article>
</section>

<section class="quick-links" aria-labelledby="quick-links-title">
  <div class="section-heading"><div><p class="section-eyebrow">QUICK ACCESS</p><h2 id="quick-links-title">防災情報にすぐアクセス</h2></div></div>
  <div class="link-grid">
    <a class="link-card" href="/shelter_search">
      <span class="link-icon link-icon--blue"><svg class="icon" aria-hidden="true"><use href="#icon-map"></use></svg></span>
      <strong>避難所を探す</strong><span class="link-description">開設状況や場所を確認</span><span class="link-more">詳しく見る <span aria-hidden="true">→</span></span>
    </a>
    <a class="link-card" href="/">
      <span class="link-icon link-icon--yellow"><svg class="icon" aria-hidden="true"><use href="#icon-chart"></use></svg></span>
      <strong>データを見る</strong><span class="link-description">気象・防災情報を確認</span><span class="link-more">詳しく見る <span aria-hidden="true">→</span></span>
    </a>
    <a class="link-card" href="/board">
      <span class="link-icon link-icon--red"><svg class="icon" aria-hidden="true"><use href="#icon-people"></use></svg></span>
      <strong>みんなの防災情報</strong><span class="link-description">地域からのお知らせ</span><span class="link-more">詳しく見る <span aria-hidden="true">→</span></span>
    </a>
    <a class="link-card" href="/shelter_register">
      <span class="link-icon link-icon--green"><svg class="icon" aria-hidden="true"><use href="#icon-plan"></use></svg></span>
      <strong>わが家の避難計画</strong><span class="link-description">避難先を登録・確認</span><span class="link-more">詳しく見る <span aria-hidden="true">→</span></span>
    </a>
  </div>
</section>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const map = L.map('shelterMap').setView([40.8244, 140.7400], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors',
        referrerPolicy: 'strict-origin-when-cross-origin'
    }).addTo(map);

    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(response => response.json())
            .then(data => {
                console.log('気象情報を更新しました:', data);
                updateWeatherContent(data);
            })
            .catch(error => {
                console.error('気象情報の更新に失敗しました:', error);
            });
    }

    function updateWeatherContent(data) {
        const weatherContent = document.getElementById('weatherContent');

      function getWarningLevel(code) {
        const levels = {
          '32': 5, '33': 5, '35': 5, '36': 5, '37': 5, '38': 5, '39': 5,
          '43': 4, '48': 4, '49': 4,
          '03': 3, '04': 3, '05': 3, '06': 3, '07': 3, '08': 3, '09': 3,
          '10': 2, '12': 2, '13': 2, '14': 2, '15': 2, '16': 2,
          '17': 2, '18': 2, '19': 2, '20': 2, '21': 2, '22': 2,
          '23': 2, '24': 2, '25': 2, '26': 2, '27': 2, '29': 2
        };
        return levels[code] || 1;
      }

        if (data.error) {
            weatherContent.innerHTML = '<p>気象情報の取得に失敗しました</p>';
            return;
        }

        const highestLevel = data.warnings && data.warnings.length > 0
          ? Math.max(...data.warnings.map(warning => getWarningLevel(warning.code)))
          : 0;
        const heroStatus = document.getElementById('heroStatus');
        const alertBanner = document.getElementById('alertBanner');
        heroStatus.className = `status-chip ${highestLevel ? `status-chip--level-${highestLevel}` : 'status-chip--safe'}`;
        heroStatus.innerHTML = highestLevel
          ? `<span class="status-chip__level">警戒レベル ${highestLevel}</span><span>警報・注意報あり</span>`
          : '<svg class="icon" aria-hidden="true"><use href="#icon-check"></use></svg><span>現在、警報・注意報はありません</span>';

        if (highestLevel >= 3) {
          const importantWarning = data.warnings.find(warning => getWarningLevel(warning.code) === highestLevel);
          alertBanner.hidden = false;
          alertBanner.className = `alert-banner alert-banner--level-${highestLevel}`;
          alertBanner.innerHTML = `<svg class="icon" aria-hidden="true"><use href="#icon-alert"></use></svg><div><strong>${importantWarning.name}</strong><span>${importantWarning.status || '発表されています'}</span></div><a href="#weatherContent">詳細を見る <span aria-hidden="true">→</span></a>`;
        } else {
          alertBanner.hidden = true;
          alertBanner.innerHTML = '';
        }

        let warningsHtml = '';
        if (data.warnings && data.warnings.length > 0) {
          warningsHtml = '<ul class="warning-list">';
            data.warnings.forEach(warning => {
            const level = getWarningLevel(warning.code);
            warningsHtml += `<li class="warning-item level-${level}"><span class="level-label">警戒レベル ${level}</span> <strong>${warning.name}</strong>（${warning.status}）</li>`;
            });
            warningsHtml += '</ul>';
        } else {
            warningsHtml = '<div class="weather-status"><span class="check">✓</span><span>現在、警報・注意報は発表されていません</span></div>';
        }

        weatherContent.innerHTML = `
            <div class="weather-city"><svg class="icon" aria-hidden="true"><use href="#icon-pin"></use></svg><span>${data.area_name || '青森市'}</span></div>
            ${warningsHtml}
            <div class="weather-detail"><svg class="icon" aria-hidden="true"><use href="#icon-clock"></use></svg><span>データ取得: ${data.last_fetch_time || '更新中...'}</span></div>
            <div class="weather-detail"><svg class="icon" aria-hidden="true"><use href="#icon-cloud"></use></svg><span>気象庁発表: ${data.report_time || '不明'}</span></div>
        `;
    }

    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
