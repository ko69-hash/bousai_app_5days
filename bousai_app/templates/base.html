<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <p class="hero-kicker">防災・気象情報</p>
      <h1 class="brand">防災アプリ</h1>
      <p class="hero-location"><svg class="icon" aria-hidden="true"><use href="#icon-pin"></use></svg>青森市</p>
      <div id="heroStatus" class="status-chip status-chip--safe" role="status">
        <svg class="icon" aria-hidden="true"><use href="#icon-check"></use></svg>
        <span>現在、警報・注意報はありません</span>
      </div>
    </div>
    <button class="menu-button" type="button" aria-label="メニューを開く" aria-expanded="false">
      <span class="menu-icon"><span></span></span>
    </button>
  </header>

  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="icon-pin" viewBox="0 0 24 24"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="icon-map" viewBox="0 0 24 24"><path d="m9 18-6 3V6l6-3 6 3 6-3v15l-6 3-6-3Z"/><path d="M9 3v15M15 6v15"/></symbol>
    <symbol id="icon-cloud" viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .7-7.94A6 6 0 0 0 6.1 8.7 4.75 4.75 0 0 0 7 18Z"/></symbol>
    <symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="icon-chart" viewBox="0 0 24 24"><path d="M4 19V5M4 19h16"/><path d="m7 15 3-4 3 2 5-7"/></symbol>
    <symbol id="icon-people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 19a6 6 0 0 1 12 0M16 5a3 3 0 0 1 0 6M17 13a5 5 0 0 1 4 6"/></symbol>
    <symbol id="icon-plan" viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></symbol>
    <symbol id="icon-alert" viewBox="0 0 24 24"><path d="M12 4 21 20H3L12 4Z"/><path d="M12 9v5M12 17h.01"/></symbol>
  </svg>

  <nav class="nav-panel tab-bar" aria-label="メインメニュー">
    <a class="tab-link" href="/"{% if request.path == '/' %} aria-current="page"{% endif %}>ホーム</a>
    <a class="tab-link" href="/shelter_search"{% if request.path == '/shelter_search' %} aria-current="page"{% endif %}>避難所検索</a>
    <a class="tab-link" href="/board"{% if request.path == '/board' %} aria-current="page"{% endif %}>お知らせ</a>
    <a class="utility-link" href="/shelter_register">避難所登録</a>
    {% if session.logged_in %}
      <a class="utility-link" href="/logout">ログアウト{% if session.username %}（{{ session.username }}）{% endif %}</a>
    {% else %}
      <a class="utility-link" href="/login">ログイン</a>
    {% endif %}
  </nav>

  <main class="main-shell">
    {% block content %}{% endblock %}
  </main>

  <script>
    const menuButton = document.querySelector('.menu-button');
    const navPanel = document.querySelector('.nav-panel');
    if (menuButton && navPanel) {
      menuButton.addEventListener('click', () => {
        const isOpen = navPanel.classList.toggle('is-open');
        menuButton.setAttribute('aria-expanded', String(isOpen));
      });
    }
  </script>
</body>
</html>
